[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dupla-api"
version = "0.1.0"
description = "Encapsulated Dupla API: project pipeline (GEBSA IV) + RQ workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "openai>=1.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "openpyxl>=3.1",
  "pymupdf>=1.24.0",
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "lib"]
