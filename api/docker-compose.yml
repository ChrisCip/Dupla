services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      JOB_DATA_DIR: /app/data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  worker:
    build: .
    command: python -m worker
    environment:
      REDIS_URL: redis://redis:6379/0
      JOB_DATA_DIR: /app/data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
